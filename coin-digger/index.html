<title>Coin Diggers</title>
<style>
/* Layout: full-bleed 3D view. Scores and timer across the top; joystick zone on
   the left, bucket slider on the right. */
:root {
  --bg: #20242a;
  --ink: #f4f1ea;
  --dim: #a8adb4;
  --you: #ffc53d;
  --rival: #ff5a4f;
  --glass: rgba(24, 27, 32, 0.66);
  --line: rgba(244, 241, 234, 0.2);
  --font: "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font);
  overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none;
}
#app { position: fixed; inset: 0; }
#app canvas { display: block; width: 100%; height: 100%; }
.hud { position: fixed; inset: 0; pointer-events: none; }
.top {
  position: absolute; top: calc(10px + env(safe-area-inset-top, 0px)); left: 16px; right: 16px;
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px;
  font-variant-numeric: tabular-nums; text-shadow: 0 2px 6px rgba(0,0,0,0.6);
}
.score { display: grid; gap: 2px; }
.score b { font-size: 34px; line-height: 1; }
.score span { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); }
.score.you b { color: var(--you); }
.score.rival { text-align: right; }
.score.rival b { color: var(--rival); }
#timer { font-size: 22px; padding: 6px 12px; border-radius: 10px; background: var(--glass); border: 1px solid var(--line); }
#stick {
  position: absolute; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%;
  border: 2px solid var(--line); background: rgba(24,27,32,0.35);
}
#stick i {
  position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px;
  border-radius: 50%; background: rgba(244,241,234,0.75);
}
.zone { position: absolute; left: 0; top: 90px; bottom: 0; right: 30vw; pointer-events: auto; touch-action: none; }
.slider {
  position: absolute; right: 12px; top: calc(110px + env(safe-area-inset-top, 0px));
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  width: min(20vw, 72px); pointer-events: auto; touch-action: none;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
}
.track {
  flex: 1; width: 44px; position: relative; border-radius: 14px;
  background: rgba(24, 27, 32, 0.4); border: 1px solid var(--line);
}
.track em {
  position: absolute; left: 0; right: 0; font: 11px/1 var(--font); letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--dim); text-align: center; font-style: normal;
}
.track .knob {
  position: absolute; left: -6px; right: -6px; height: 22px; margin-bottom: -11px; bottom: 0;
  border-radius: 8px; background: var(--you); box-shadow: 0 2px 8px rgba(0,0,0,0.5);
}
.slider .lbl { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); }
#msg {
  position: absolute; left: 16px; right: 16px; top: 34%; text-align: center;
  font-size: clamp(30px, 9vw, 60px); line-height: 1.05; text-shadow: 0 3px 14px rgba(0,0,0,0.7);
}
.panel { position: absolute; left: 0; right: 0; top: 52%; display: flex; justify-content: center; pointer-events: auto; }
.btn {
  font: 700 18px/1 var(--font); padding: 14px 22px; border-radius: 12px;
  border: 0; background: var(--you); color: #2a2000;
}
.btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
</style>

<div id="app"></div>
<div class="hud">
  <div class="top">
    <div class="score you"><b id="scoreYou">0</b><span>You</span></div>
    <div id="timer">1:30</div>
    <div class="score rival"><b id="scoreRival">0</b><span>Rival</span></div>
  </div>
  <div class="zone" id="zone"></div>
  <div id="stick" hidden><i></i></div>
  <div class="slider" id="slider">
    <div class="track" id="track">
      <em style="top:8px">Dump</em>
      <em style="top:50%">Carry</em>
      <em style="bottom:8px">Scoop</em>
      <div class="knob" id="knob"></div>
    </div>
    <span class="lbl" id="load">Bucket</span>
  </div>
  <div id="msg"></div>
  <div class="panel" id="panel" hidden><button class="btn" id="againBtn">Play again</button></div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js';
import RAPIER from 'https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.14.0/rapier.es.js';

// ---------------------------------------------------------------------------
// Tuning
// ---------------------------------------------------------------------------
const CFG = {
  dt: 1 / 60,
  matchTime: 90,
  arena: { halfX: 15, halfZ: 20, wallH: 1.5 },
  hole: { size: 5, depth: 3, z: 15 },           // holes at z = +15 (you) and -15 (rival)
  coins: { count: 320, radius: 0.35, half: 0.07, mass: 2, rainEvery: 0.012, rainRadius: 4, rainHeight: 9 },
  // Solver: more iterations keep coin heaps calm. Contacts stay stiff (soft ones let
  // coins sink through the bucket floor). maxCoinUp caps how fast a coin can be launched.
  solver: { iterations: 8, contactFrequency: 30, maxCoinUp: 3.5 },
  // Load: coins in the bucket lock to it once it's curled past lockCurl and are
  // released when it drops below releaseCurl (tipping to dump, or lowering to scoop).
  // grip nudges loose coins along with the bucket while it's filling.
  assist: { grip: 20, lockCurl: 0.25, releaseCurl: 0.1, wallMargin: 0.4 },
  // A digger tilted past tiltUp (its up vector's height) is flipped: no drive, drops its
  // load, rights itself after stun seconds. aiChance: per second, near you and empty-handed.
  flip: { tiltUp: 0.6, stun: 3, aiChance: 0.35, assist: 24000 },   // assist: N·m roll push while a bucket heaves under a digger
  digger: {
    mass: 3000, engine: 22000, drag: 3400, grip: 10, turnRate: 1.6, turnResponse: 4,   // drag sets top speed ≈ engine / drag ≈ 6.5 m/s
    armPivot: [0, 1.25, 0.95], armLength: 1.55,     // short chunky arm
    bucketSpeed: 1.0,                             // slider units per second the bucket can move
    armRate: 0.9,                                 // rad/s the arm can lift or lower
    curlRate: 1.3,                                // rad/s the bucket can curl or tip (slow enough to keep coins in)
  },
};

// Bucket interior in its own frame (hinge at origin): where a coin counts as "in the bucket"
const BUCKET = { halfWidth: 1.4, zMin: -0.2, zMax: 1.7, yMin: -0.6, yMax: 1.1, centre: [0, 0, 0.75] };

// Collision groups: (membership << 16) | filter
const W = 1, C = 2, DP = 4, BP = 8, BR = 16, DR = 32, L = 64;
const grp = (mem, filter) => (mem << 16) | filter;
const G = {
  world: grp(W, 0xffff),
  coin: grp(C, W | C | DP | DR | BP | BR),
  digger: [grp(DP, W | C | DR | BR | L), grp(DR, W | C | DP | BP | L)],
  bucket: [grp(BP, C | DR), grp(BR, C | DP)],     // a bucket hits coins and the other digger (never its own); it's code-driven, so it shoves with unstoppable force
  lid: grp(L, DP | DR),                           // diggers drive over the hole, coins fall through
};

// ---------------------------------------------------------------------------
// Scene
// ---------------------------------------------------------------------------
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
app.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color('#20242a');
scene.add(new THREE.HemisphereLight('#ffffff', '#3b3f46', 1.3));
const sun = new THREE.DirectionalLight('#ffffff', 2.0);
sun.position.set(12, 30, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -25, right: 25, top: 25, bottom: -25, near: 1, far: 80 });
scene.add(sun);
const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.5, 200);

let world, events;
const _m = new THREE.Matrix4(), _q = new THREE.Quaternion(), _v = new THREE.Vector3();

// ---------------------------------------------------------------------------
// Arena: ground with two square holes, pits below, walls, and a lid over each
// hole that only the diggers collide with.
// ---------------------------------------------------------------------------
function staticBox(hx, hy, hz, x, y, z, group = G.world, color = null) {
  world.createCollider(RAPIER.ColliderDesc.cuboid(hx, hy, hz).setTranslation(x, y, z)
    .setFriction(0.6).setCollisionGroups(group));
  if (color) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(hx * 2, hy * 2, hz * 2), new THREE.MeshStandardMaterial({ color, roughness: 0.9 }));
    m.position.set(x, y, z); m.receiveShadow = true; m.castShadow = color !== '#5b8c4a';
    scene.add(m);
  }
}
function buildArena() {
  const { halfX: X, halfZ: Z, wallH } = CFG.arena;
  const { size, depth, z: hz } = CFG.hole, h = size / 2;
  const ground = '#5b8c4a';
  // ground slabs (top at y = 0), leaving two holes
  staticBox(X, 0.5, (Z - hz - h) / 2, 0, -0.5, -(Z + hz + h) / 2, G.world, ground);
  staticBox(X, 0.5, (Z - hz - h) / 2, 0, -0.5, (Z + hz + h) / 2, G.world, ground);
  staticBox(X, 0.5, hz - h, 0, -0.5, 0, G.world, ground);
  for (const s of [-1, 1]) {
    staticBox((X - h) / 2, 0.5, h, -(X + h) / 2, -0.5, s * hz, G.world, ground);
    staticBox((X - h) / 2, 0.5, h, (X + h) / 2, -0.5, s * hz, G.world, ground);
    // pit: floor and walls
    staticBox(h, 0.25, h, 0, -depth - 0.25, s * hz, G.world, '#1a1c20');
    staticBox(0.25, depth / 2, h, -h - 0.25, -depth / 2, s * hz, G.world, '#2b2e33');
    staticBox(0.25, depth / 2, h, h + 0.25, -depth / 2, s * hz, G.world, '#2b2e33');
    staticBox(h, depth / 2, 0.25, 0, -depth / 2, s * hz - h - 0.25, G.world, '#2b2e33');
    staticBox(h, depth / 2, 0.25, 0, -depth / 2, s * hz + h + 0.25, G.world, '#2b2e33');
    staticBox(h, 0.05, h, 0, -0.05, s * hz, G.lid);           // invisible lid for diggers
    // coloured rim so you can tell whose hole is whose
    const rim = new THREE.Mesh(new THREE.RingGeometry(h * 1.0, h * 1.18, 4, 1).rotateX(-Math.PI / 2).rotateY(Math.PI / 4),
      new THREE.MeshBasicMaterial({ color: s > 0 ? '#ffc53d' : '#ff5a4f' }));
    rim.scale.set(Math.SQRT2, 1, Math.SQRT2);
    rim.position.set(0, 0.02, s * hz);
    scene.add(rim);
  }
  // walls
  staticBox(X + 0.5, wallH / 2, 0.5, 0, wallH / 2, -Z - 0.5, G.world, '#8a9099');
  staticBox(X + 0.5, wallH / 2, 0.5, 0, wallH / 2, Z + 0.5, G.world, '#8a9099');
  staticBox(0.5, wallH / 2, Z, -X - 0.5, wallH / 2, 0, G.world, '#8a9099');
  staticBox(0.5, wallH / 2, Z, X + 0.5, wallH / 2, 0, G.world, '#8a9099');
}

// ---------------------------------------------------------------------------
// Coins: one dynamic cylinder each, drawn with a single instanced mesh.
// Coins that fall into a pit score for that hole's owner and pour back in.
// ---------------------------------------------------------------------------
const coins = [];
let coinMesh;
const rainQueue = [];
let rainTimer = 0;
function buildCoins() {
  const { count, radius, half, mass } = CFG.coins;
  coinMesh = new THREE.InstancedMesh(new THREE.CylinderGeometry(radius, radius, half * 2, 18),
    new THREE.MeshStandardMaterial({ color: '#ffd23f', metalness: 0.25, roughness: 0.35, emissive: '#7a5200', emissiveIntensity: 0.45 }), count);
  coinMesh.castShadow = true;
  coinMesh.frustumCulled = false;
  scene.add(coinMesh);
  for (let i = 0; i < count; i++) {
    const body = world.createRigidBody(RAPIER.RigidBodyDesc.dynamic().setTranslation(0, -50 - i, 0).setCanSleep(true)
      .setLinearDamping(0.15).setAngularDamping(0.8));
    body.setEnabled(false);
    world.createCollider(RAPIER.ColliderDesc.cylinder(half, radius).setMass(mass).setFriction(0.7).setRestitution(0.02)
      .setCollisionGroups(G.coin), body);
    coins.push({ body, live: false });
    rainQueue.push(i);
  }
}
function rain(dt) {
  rainTimer -= dt;
  while (rainTimer <= 0 && rainQueue.length) {
    rainTimer += CFG.coins.rainEvery;
    const c = coins[rainQueue.shift()];
    if (c.lockedTo) { c.body.setBodyType(RAPIER.RigidBodyType.Dynamic, true); c.lockedTo = null; }
    const a = Math.random() * Math.PI * 2, r = Math.sqrt(Math.random()) * CFG.coins.rainRadius;
    c.body.setEnabled(true);
    c.body.setTranslation({ x: Math.cos(a) * r, y: CFG.coins.rainHeight + Math.random() * 2, z: Math.sin(a) * r }, true);
    c.body.setRotation(new THREE.Quaternion().setFromEuler(new THREE.Euler(Math.random() * 3, Math.random() * 3, 0)), true);
    c.body.setLinvel({ x: 0, y: -8, z: 0 }, true);
    c.body.setAngvel({ x: Math.random() * 6 - 3, y: 0, z: Math.random() * 6 - 3 }, true);
    c.live = true;
  }
  if (!rainQueue.length) rainTimer = 0;
}
function collectCoins() {
  const { z: hz, size } = CFG.hole;
  coins.forEach((c, i) => {
    if (!c.live) return;
    const p = c.body.translation();
    if (p.y > -1) return;
    if (Math.abs(p.x) < size / 2 + 0.5 && Math.abs(Math.abs(p.z) - hz) < size / 2 + 0.5 && state.playing) {
      state.score[p.z > 0 ? 0 : 1]++;
    }
    c.live = false;
    c.body.setEnabled(false);
    rainQueue.push(i);
  });
}

// ---------------------------------------------------------------------------
// Diggers: a dynamic tracked chassis, plus a kinematic arm and bucket whose
// pose is set from the chassis every step. The bucket slider s (0..1) maps to
// scoop (flat on the ground) -> carry (curled back) -> dump (tipped forward).
// ---------------------------------------------------------------------------
function bucketPose(s) {
  const D = CFG.digger;
  const lowA = Math.asin((0.695 - D.armPivot[1]) / D.armLength);  // hinge low enough to put the cutting edge just under the ground
  // Like a real loader: curl the bucket back while it's low, then lift, and only tip at the top.
  const ss = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
  const CURL = 0.7, DUMP = -1.2;
  const arm = lowA + 0.15 * ss(0.08, 0.35, s) + (0.95 - lowA - 0.15) * ss(0.35, 0.85, s);
  const curl = CURL * ss(0.08, 0.35, s) + (DUMP - CURL) * ss(0.85, 1, s);      // + = front of bucket up (holds coins)
  return { arm, curl };
}

function makeDigger(idx, pos, heading, color) {
  const D = CFG.digger;
  const q = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), heading);
  const body = world.createRigidBody(RAPIER.RigidBodyDesc.dynamic().setTranslation(pos.x, 0.05, pos.z).setRotation(q)
    .setLinearDamping(0.3).setAngularDamping(2));
  const group = new THREE.Group();
  scene.add(group);
  const mat = c => new THREE.MeshStandardMaterial({ color: c, roughness: 0.5, metalness: 0.05 });
  const paint = mat(color), dark = mat('#2b2d33'), white = mat('#f6f3ec');
  const glass = new THREE.MeshStandardMaterial({ color: '#7fc8e8', roughness: 0.15, metalness: 0.1, emissive: '#1d4a5c', emissiveIntensity: 0.4 });
  const box = (w, h, dpt, x, y, z, m, parent = group) => {
    const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, dpt), m);
    b.position.set(x, y, z); b.castShadow = true; parent.add(b); return b;
  };

  // Colliders: squat body, cab, and two hidden skids where the wheels are (friction 0, driving is forces)
  for (const [hx, hy, hz, x, y, z, frac, fric] of [
    [1.05, 0.4, 1.35, 0, 0.85, 0, 0.55, 0.4],    // body
    [0.75, 0.65, 0.7, 0, 1.9, -0.45, 0.15, 0.4], // cab
  ]) {
    world.createCollider(RAPIER.ColliderDesc.cuboid(hx, hy, hz).setTranslation(x, y, z).setMass(D.mass * frac)
      .setFriction(fric).setFrictionCombineRule(RAPIER.CoefficientCombineRule.Min)   // slide over coins instead of grinding on them
      .setCollisionGroups(G.digger[idx]), body);
  }
  // Round wheels (balls, friction 0: driving is forces) so a bucket's wedge can slide under them and lever the digger up
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
    world.createCollider(RAPIER.ColliderDesc.ball(0.56).setTranslation(sx * 1.2, 0.56, sz * 0.88).setMass(D.mass * 0.075)
      .setFriction(0).setFrictionCombineRule(RAPIER.CoefficientCombineRule.Min).setCollisionGroups(G.digger[idx]), body);
  }

  // Look: a chunky toy. Body, dark skirt, big cab with wide windows and a cap roof
  box(2.1, 0.8, 2.7, 0, 0.85, 0, paint);
  box(2.2, 0.18, 2.8, 0, 0.42, 0, dark);
  box(1.5, 1.25, 1.35, 0, 1.88, -0.45, paint);
  box(1.52, 0.62, 1.37, 0, 2.02, -0.45, glass);            // window band all round
  box(1.42, 0.62, 1.39, 0, 2.02, -0.45, glass);
  box(1.7, 0.16, 1.55, 0, 2.58, -0.45, white);             // roof cap
  box(0.32, 0.22, 0.32, 0, 2.77, -0.55, mat(idx === 0 ? '#ff8a1f' : '#3fb7ff'));  // beacon
  box(0.22, 0.6, 0.22, -0.7, 1.55, -1.1, dark);            // exhaust stack
  box(1.8, 0.5, 0.35, 0, 0.95, -1.42, dark);               // rear bumper / counterweight
  // headlight "eyes" on the nose
  for (const sx of [-1, 1]) {
    box(0.42, 0.42, 0.06, sx * 0.62, 1.0, 1.37, white);
    box(0.2, 0.2, 0.04, sx * 0.62, 1.0, 1.41, dark);
  }
  // fat octagonal wheels with coloured hubs
  const wheelGeo = new THREE.CylinderGeometry(0.58, 0.58, 0.5, 8).rotateZ(Math.PI / 2);
  const hubGeo = new THREE.CylinderGeometry(0.26, 0.26, 0.54, 8).rotateZ(Math.PI / 2);
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
    const w = new THREE.Mesh(wheelGeo, dark); w.position.set(sx * 1.2, 0.58, sz * 0.88); w.castShadow = true; group.add(w);
    const h = new THREE.Mesh(hubGeo, white); h.position.copy(w.position); group.add(h);
  }

  // Arm: two short thick beams from the pivot (visual only)
  const armMat = mat('#3a3d45');
  const arms = [-1, 1].map(sx => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.38, 1).translate(0, 0, 0.5), armMat);
    m.position.set(sx * 0.85, D.armPivot[1], D.armPivot[2]); m.castShadow = true; group.add(m);
    return m;
  });
  box(1.9, 0.3, 0.3, 0, D.armPivot[1], D.armPivot[2], armMat);   // pivot crossbar

  // Bucket: kinematic body built from convex side-profile pieces (z forward, y up,
  // hinge at the origin), each extruded across the bucket's width. The same
  // outline is used for the collider and the mesh, so what you see is what scoops.
  const bucketBody = world.createRigidBody(RAPIER.RigidBodyDesc.kinematicPositionBased());
  const bucketGroup = new THREE.Group(); scene.add(bucketGroup);
  const steel = mat('#b9bec7'), edge = mat('#6c717a');
  const prism = (profile, x0, x1, m, cx0 = x0, cx1 = x1) => {   // cx0/cx1: collider can be wider than the mesh
    const pts = [];
    for (const [z, y] of profile) pts.push(cx0, y, z, cx1, y, z);
    world.createCollider(RAPIER.ColliderDesc.convexHull(new Float32Array(pts)).setFriction(0.8)
      .setCollisionGroups(G.bucket[idx]), bucketBody);
    const g = new THREE.ExtrudeGeometry(new THREE.Shape(profile.map(([z, y]) => new THREE.Vector2(z, y))), { depth: x1 - x0, bevelEnabled: false });
    g.rotateY(-Math.PI / 2).translate(x1, 0, 0);     // shape (z, y) extruded along -x, then shifted to span x0..x1
    const mesh = new THREE.Mesh(g, m); mesh.castShadow = true; bucketGroup.add(mesh);
  };
  const W = BUCKET.halfWidth;                        // inner half-width
  for (const [profile, m] of [
    [[[-0.3, 0.75], [-0.14, 0.75], [-0.03, -0.24], [-0.19, -0.28]], steel],     // tall slanted back
    [[[-0.24, 0.75], [-0.14, 0.75], [0.22, 0.86], [0.18, 0.95]], edge],         // spill guard: lip angled forward over the load
    [[[-0.19, -0.28], [-0.03, -0.24], [0.1, -0.46], [-0.04, -0.62]], steel],    // heel, upper
    [[[-0.04, -0.62], [0.1, -0.46], [0.36, -0.55], [0.34, -0.715]], steel],     // heel, lower
    [[[0.34, -0.715], [0.36, -0.55], [1.4, -0.55], [1.4, -0.715]], steel],     // floor (thick, so coins can't push through)
    [[[1.4, -0.715], [1.4, -0.55], [1.78, -0.695], [1.78, -0.715]], edge],     // cutting edge: a wedge that slides under coins
  ]) prism(profile, -W, W, m);
  const side = [[-0.3, 0.75], [0.2, 0.95], [1.1, 0.75], [1.78, 0.35], [1.78, -0.715], [0.34, -0.715], [-0.04, -0.62], [-0.19, -0.28]];   // tall right to the front so heaps can't spill sideways
  prism(side, W, W + 0.2, edge, W, W + 0.5);       // thick hidden collider outside the plate so coins can't be squeezed through
  prism(side, -W - 0.2, -W, edge, -W - 0.5, -W);
  // Teeth: wedges past the cutting edge, flat underneath, sloping up to the lip
  const tooth = [[1.58, -0.715], [1.58, -0.6], [2.08, -0.705], [2.08, -0.715]];
  for (let k = 0; k < 6; k++) { const x = -1.15 + k * 0.46; prism(tooth, x - 0.09, x + 0.09, edge); }
  const d = { idx, body, group, arms, bucketBody, bucketGroup, s: 0, sTarget: 0, ai: { mode: 'seek', t: 0 }, home: { x: pos.x, z: pos.z, yaw: heading } };
  placeBucket(d, true);
  return d;
}

function chassisMatrix(d, out) {
  const t = d.body.translation(), r = d.body.rotation();
  return out.compose(_v.set(t.x, t.y, t.z), _q.set(r.x, r.y, r.z, r.w), new THREE.Vector3(1, 1, 1));
}
// Bucket world pose from the chassis pose and the slider value
function placeBucket(d, teleport) {
  const D = CFG.digger;
  // The slider sets where the bucket should be; the arm and curl chase it at
  // limited rates so the bucket never whips round and flings its load.
  const want = bucketPose(d.s);
  const dt = teleport ? 1 : CFG.dt;
  if (teleport || d.arm == null) { d.arm = want.arm; d.curl = want.curl; }
  d.arm += Math.max(-D.armRate * dt, Math.min(D.armRate * dt, want.arm - d.arm));
  d.curl += Math.max(-D.curlRate * dt, Math.min(D.curlRate * dt, want.curl - d.curl));
  const arm = d.arm, curl = d.curl;
  const hinge = new THREE.Vector3(0, D.armPivot[1] + Math.sin(arm) * D.armLength, D.armPivot[2] + Math.cos(arm) * D.armLength);
  const local = new THREE.Matrix4().compose(hinge, new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), -curl), new THREE.Vector3(1, 1, 1));
  const m = chassisMatrix(d, new THREE.Matrix4()).multiply(local);
  const pos = new THREE.Vector3(), rot = new THREE.Quaternion(); m.decompose(pos, rot, new THREE.Vector3());
  d.nextBucket = (d.nextBucket || new THREE.Matrix4()).copy(m);   // where the bucket will be after this step
  if (teleport) { d.bucketBody.setTranslation(pos, true); d.bucketBody.setRotation(rot, true); }
  else { d.bucketBody.setNextKinematicTranslation(pos); d.bucketBody.setNextKinematicRotation(rot); }
  d.armAngle = arm;
}

// Bucket load. While the bucket is low, coins tumble in with full physics (and get
// a nudge to keep up with it). Once it's curled to carry, coins resting inside are
// locked to the bucket and move exactly with it: the physics engine can't keep a
// heap of thin coins inside a code-driven bucket that swings round. When the bucket
// tips to dump (or lowers to scoop again) they're released as normal coins.
const _inv = new THREE.Matrix4(), _bp = new THREE.Vector3(), _bq = new THREE.Quaternion(), _lp = new THREE.Vector3();
const _cw = new THREE.Matrix4(), _cp = new THREE.Vector3(), _cq = new THREE.Quaternion(), ONE = new THREE.Vector3(1, 1, 1);
function holdLoad(d, dt) {
  const A = CFG.assist, b = d.bucketBody;
  const t = b.translation(), r = b.rotation();
  _bp.set(t.x, t.y, t.z); _bq.set(r.x, r.y, r.z, r.w);
  const now = new THREE.Matrix4().compose(_bp, _bq, ONE);
  _inv.copy(now).invert();
  const centre = new THREE.Vector3(...BUCKET.centre).applyMatrix4(now);
  const flipped = (d.tipTime || 0) > 0.15;
  const lockNow = d.curl > A.lockCurl && !flipped, release = d.curl < A.releaseCurl || flipped;
  const k = Math.min(1, A.grip * dt);
  let load = 0;
  for (const c of coins) {
    if (!c.live) continue;
    if (c.lockedTo === d) {
      const next = _cw.copy(d.nextBucket).multiply(c.local);
      if (release) {                                   // let go, keeping the bucket's motion
        const was = new THREE.Vector3().setFromMatrixPosition(_cw.copy(now).multiply(c.local));
        const nextPos = new THREE.Vector3().setFromMatrixPosition(next.copy(d.nextBucket).multiply(c.local));
        const v = nextPos.sub(was).multiplyScalar(1 / dt);
        c.body.setBodyType(RAPIER.RigidBodyType.Dynamic, true);
        c.body.setLinvel(v, true); c.body.setAngvel({ x: 0, y: 0, z: 0 }, true);
        c.lockedTo = null;
      } else {
        next.decompose(_cp, _cq, _lp);
        c.body.setNextKinematicTranslation(_cp); c.body.setNextKinematicRotation(_cq);
        load++;
        continue;
      }
    }
    if (c.lockedTo) continue;                          // riding in the other digger's bucket
    const p = c.body.translation();
    if ((p.x - centre.x) ** 2 + (p.y - centre.y) ** 2 + (p.z - centre.z) ** 2 > 7) continue;
    _lp.set(p.x, p.y, p.z).applyMatrix4(_inv);
    if (Math.abs(_lp.x) > BUCKET.halfWidth || _lp.z < BUCKET.zMin || _lp.z > BUCKET.zMax || _lp.y < BUCKET.yMin || _lp.y > BUCKET.yMax) continue;
    load++;
    if (lockNow) {                                     // lock this coin to the bucket where it sits
      const q = c.body.rotation();
      c.local = new THREE.Matrix4().copy(_inv).multiply(_cw.compose(_cp.set(p.x, p.y, p.z), _cq.set(q.x, q.y, q.z, q.w), ONE));
      c.body.setBodyType(RAPIER.RigidBodyType.KinematicPositionBased, true);
      c.lockedTo = d;
      continue;
    }
    if (release) continue;
    // still filling: carry the coin along with the bucket's sideways/forward motion
    const goal = _cp.copy(_lp).applyMatrix4(d.nextBucket);
    const tx = (goal.x - p.x) / dt, ty = (goal.y - p.y) / dt, tz = (goal.z - p.z) / dt;
    if (tx * tx + tz * tz < 0.01 && c.body.isSleeping()) continue;
    const v = c.body.linvel();
    const nv = new THREE.Vector3(v.x + (tx - v.x) * k, v.y, v.z + (tz - v.z) * k);
    // Code wall inside each side plate: a coin pressed into a side is put back
    // inside, and can't keep moving outward relative to the bucket (the heap
    // behind it can otherwise squeeze it through the plate).
    const lim = BUCKET.halfWidth - 0.08;
    if (Math.abs(_lp.x) > lim) {
      _lp.x = Math.sign(_lp.x) * lim;
      const back = _lp.clone().applyMatrix4(now);
      c.body.setTranslation(back, true);
    }
    if (Math.abs(_lp.x) > BUCKET.halfWidth - A.wallMargin) {
      const side = new THREE.Vector3(Math.sign(_lp.x), 0, 0).applyQuaternion(_bq);
      const out = nv.x * side.x + nv.y * side.y + nv.z * side.z - (tx * side.x + ty * side.y + tz * side.z);
      if (out > 0) nv.addScaledVector(side, -out);
    }
    c.body.setLinvel(nv, true);
  }
  d.load = load;
}

// Flip assist: while this digger's bucket is heaving upward against the other
// digger, roll the other one away from it, so a committed scoop-and-lift flips it.
function flipAssist(d, foe, dt) {
  const lifting = d.arm - (d.prevArm ?? d.arm) > 1e-4;
  d.prevArm = d.arm;
  if (!lifting) return;
  const fp = foe.body.translation(), fr = foe.body.rotation();
  const foeUp = new THREE.Vector3(0, 1, 0).applyQuaternion(_q.set(fr.x, fr.y, fr.z, fr.w));
  if (foeUp.y < 0.15) return;                                  // already over: let it fall
  // is the other digger right at this bucket's mouth?
  const b = d.bucketBody, t = b.translation(), r = b.rotation();
  const inv = new THREE.Matrix4().compose(new THREE.Vector3(t.x, t.y, t.z), new THREE.Quaternion(r.x, r.y, r.z, r.w), new THREE.Vector3(1, 1, 1)).invert();
  const l = new THREE.Vector3(fp.x, fp.y, fp.z).applyMatrix4(inv);
  if (l.z < -0.5 || l.z > 4.6 || Math.abs(l.x) > 2.8 || l.y < -2 || l.y > 2) return;   // a digger hit end-on has its centre further out
  const mp = d.body.translation();
  const push = new THREE.Vector3(fp.x - mp.x, 0, fp.z - mp.z).normalize();
  const axis = new THREE.Vector3(0, 1, 0).cross(push);           // lifts the near side, rolls it away
  const T = axis.multiplyScalar(CFG.flip.assist);
  foe.body.applyTorqueImpulse({ x: T.x * dt, y: T.y * dt, z: T.z * dt }, true);
}

// Arcade tracked drive: turn toward a world heading, push forward as it lines up.
function drive(d, dir, throttle, dt) {
  const D = CFG.digger, b = d.body;
  const r = b.rotation(); _q.set(r.x, r.y, r.z, r.w);
  const fwd = new THREE.Vector3(0, 0, 1).applyQuaternion(_q).setY(0).normalize();
  const right = new THREE.Vector3(-fwd.z, 0, fwd.x);
  const v = b.linvel(), vel = new THREE.Vector3(v.x, 0, v.z);
  const m = b.mass();
  let want = 0, push = 0;
  const upNow = new THREE.Vector3(0, 1, 0).applyQuaternion(_q);
  if (upNow.y < CFG.flip.tiltUp) { dir = null; }  // wheels off the ground: no drive or steering
  if (dir && throttle > 0.05) {
    const err = Math.atan2(fwd.x * dir.z - fwd.z * dir.x, fwd.dot(dir));      // + = target is to the right (clockwise from above)
    if (Math.abs(err) > 2.2 && d.allowReverse) {                              // target behind: back up toward it
      const errR = Math.atan2(-fwd.x * dir.z + fwd.z * dir.x, -fwd.dot(dir));
      want = Math.max(-1, Math.min(1, errR * 2)) * D.turnRate;
      push = -throttle * 0.7 * Math.max(0, Math.cos(errR));
    } else {
      want = -Math.max(-1, Math.min(1, err * 2)) * D.turnRate;
      push = throttle * Math.max(0, Math.cos(err)) ** 2;
    }
  }
  if (upNow.y >= CFG.flip.tiltUp) {
    const F = fwd.clone().multiplyScalar(push * D.engine).addScaledVector(vel, -D.drag);
    F.addScaledVector(right, -vel.dot(right) * m * D.grip);
    b.applyImpulse({ x: F.x * dt, y: 0, z: F.z * dt }, true);
    const w = b.angvel();
    const Iy = m * (3.2 * 3.2 + 2.4 * 2.4) / 12;
    b.applyTorqueImpulse({ x: 0, y: Iy * (want - w.y) * D.turnResponse * dt, z: 0 }, true);   // softer turn-in so the load isn't flung
  }
  // flipped: stunned for a few seconds, then set back on its wheels where it is
  const up = new THREE.Vector3(0, 1, 0).applyQuaternion(_q);
  d.tipTime = up.y < CFG.flip.tiltUp ? (d.tipTime || 0) + dt : 0;
  // an unstoppable bucket can launch a digger: cap its speed and spin, and rescue it if it falls out
  const lv = b.linvel(), av = b.angvel();
  const sp = Math.hypot(lv.x, lv.y, lv.z), sw = Math.hypot(av.x, av.y, av.z);
  if (sp > 14) b.setLinvel({ x: lv.x * 14 / sp, y: lv.y * 14 / sp, z: lv.z * 14 / sp }, true);
  if (sw > 7) b.setAngvel({ x: av.x * 7 / sw, y: av.y * 7 / sw, z: av.z * 7 / sw }, true);
  if (b.translation().y < -2) {
    b.setTranslation({ x: d.home.x, y: 0.3, z: d.home.z }, true);
    b.setRotation({ x: 0, y: Math.sin(d.home.yaw / 2), z: 0, w: Math.cos(d.home.yaw / 2) }, true);
    b.setLinvel({ x: 0, y: 0, z: 0 }, true); b.setAngvel({ x: 0, y: 0, z: 0 }, true);
    d.tipTime = 0;
  }
  if (d.tipTime > CFG.flip.stun) {
    const t = b.translation();
    b.setTranslation({ x: t.x, y: 0.3, z: t.z }, true);
    b.setRotation(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), Math.atan2(fwd.x, fwd.z)), true);
    b.setLinvel({ x: 0, y: 0, z: 0 }, true); b.setAngvel({ x: 0, y: 0, z: 0 }, true);
    d.tipTime = 0;
  }
}

// Where the coins are thickest: sample some resting coins, count neighbours,
// prefer close ones. Ignores coins hugging walls or sitting by a hole.
function densestCoins(from) {
  const live = coins.filter(c => c.live).map(c => c.body.translation())
    .filter(p => p.y < 1 && Math.abs(p.x) < CFG.arena.halfX - 2 && Math.abs(p.z) < CFG.arena.halfZ - 2 && Math.abs(Math.abs(p.z) - CFG.hole.z) > 4);
  if (!live.length) return null;
  let best = null, bestScore = -Infinity;
  for (let k = 0; k < 40; k++) {
    const c = live[Math.floor(Math.random() * live.length)];
    let n = 0;
    for (const o of live) if ((o.x - c.x) ** 2 + (o.z - c.z) ** 2 < 6.25) n++;
    const score = n - 0.25 * Math.hypot(c.x - from.x, c.z - from.z);
    if (score > bestScore) { bestScore = score; best = new THREE.Vector3(c.x, 0, c.z); }
  }
  return best;
}

// AI: find coins, scoop through them, carry to its hole, dump, repeat.
function aiControl(d, dt) {
  const ai = d.ai; ai.t += dt;
  const p = d.body.translation();
  const pos = new THREE.Vector3(p.x, 0, p.z);
  const holeZ = d.idx === 0 ? CFG.hole.z : -CFG.hole.z;
  const hole = new THREE.Vector3(0, 0, holeZ);
  const r = d.body.rotation(); _q.set(r.x, r.y, r.z, r.w);
  const fwd = new THREE.Vector3(0, 0, 1).applyQuaternion(_q).setY(0).normalize();
  const foe = diggers[1 - d.idx], fp = foe.body.translation();
  const toFoe = new THREE.Vector3(fp.x - p.x, 0, fp.z - p.z);
  if (ai.mode === 'seek' && toFoe.length() < 7 && (foe.tipTime || 0) === 0 && Math.random() < dt * CFG.flip.aiChance) {
    ai.mode = 'ram'; ai.t = 0;
  }
  if (ai.mode === 'ram') {                     // bucket down, drive into the other digger, then heave it up
    const close = toFoe.length() < 4.2;
    d.sTarget = close && ai.t > 0.6 ? 1 : 0;
    if (ai.t > 3.5 || (foe.tipTime || 0) > 0.5) { ai.mode = 'seek'; ai.target = null; ai.t = 0; }
    return [toFoe.normalize(), 1];
  }
  if (ai.mode === 'seek') {
    d.sTarget = 0;
    if (!ai.target || ai.t > 6) {
      ai.target = densestCoins(p); ai.t = 0;
      if (!ai.target) return [null, 0];
    }
    const to = ai.target.clone().sub(pos);
    if (to.length() < 2.5) { ai.mode = 'scoop'; ai.t = 0; ai.scoopDir = to.clone().normalize(); ai.scoopFrom = pos.clone(); }
    return [to.normalize(), 1];
  }
  if (ai.mode === 'scoop') {                   // plough on through the coins with the bucket down
    d.sTarget = 0;
    if (pos.distanceTo(ai.scoopFrom) > 4.5 || ai.t > 2.5) { ai.mode = 'carry'; ai.t = 0; }
    return [ai.scoopDir, 1];
  }
  if (ai.mode === 'carry') {                   // curl the bucket and drive to the hole
    d.sTarget = 0.6;
    if (d.curl < 0.55 && ai.t < 1.5) return [null, 0];   // let the bucket curl before driving off, or the load spills
    const stand = hole.clone().addScaledVector(hole.clone().sub(pos).normalize(), -2.6);
    const to = stand.clone().sub(pos);
    if (to.length() < 1.2 || ai.t > 12) { ai.mode = 'dump'; ai.t = 0; }
    return [to.length() > 0.5 ? to.normalize() : hole.clone().sub(pos).normalize(), Math.min(1, to.length() / 2 + 0.3)];
  }
  if (ai.mode === 'dump') {                    // face the hole and tip
    const face = hole.clone().sub(pos).normalize();
    d.sTarget = fwd.dot(face) > 0.9 ? 1 : 0.6;
    if (ai.t > 3.4) { ai.mode = 'seek'; ai.target = null; ai.t = 0; }
    return [face, 0.15];
  }
  return [null, 0];
}

// ---------------------------------------------------------------------------
// Input: joystick (left), bucket slider (right), keyboard

const input = { dir: null, mag: 0, bucket: 0 };
const stick = document.getElementById('stick'), stickKnob = stick.querySelector('i');
const zone = document.getElementById('zone');
let stickId = null, stickOrigin = null;
zone.addEventListener('pointerdown', e => {
  stickId = e.pointerId; stickOrigin = { x: e.clientX, y: e.clientY };
  stick.style.left = e.clientX + 'px'; stick.style.top = e.clientY + 'px'; stick.hidden = false;
  try { zone.setPointerCapture(e.pointerId); } catch {}
  e.preventDefault();
});
zone.addEventListener('pointermove', e => {
  if (e.pointerId !== stickId) return;
  let dx = e.clientX - stickOrigin.x, dy = e.clientY - stickOrigin.y;
  const len = Math.hypot(dx, dy), max = 50;
  if (len > max) { dx *= max / len; dy *= max / len; }
  stickKnob.style.transform = `translate(${dx}px, ${dy}px)`;
  input.mag = Math.min(1, len / max);
  input.dir = len > 4 ? new THREE.Vector3(dx, 0, dy).normalize() : null;  // screen right = +X, screen down = +Z
});
const stickUp = e => {
  if (e.pointerId !== stickId) return;
  stickId = null; stick.hidden = true; stickKnob.style.transform = '';
  input.dir = null; input.mag = 0;
};
zone.addEventListener('pointerup', stickUp); zone.addEventListener('pointercancel', stickUp);

const track = document.getElementById('track'), knob = document.getElementById('knob');
let sliderHeld = false;
const setSlider = e => {
  const r = track.getBoundingClientRect();
  input.bucket = Math.min(1, Math.max(0, (r.bottom - e.clientY) / r.height));
};
const sliderEl = document.getElementById('slider');
sliderEl.addEventListener('pointerdown', e => { sliderHeld = true; setSlider(e); try { sliderEl.setPointerCapture(e.pointerId); } catch {} e.preventDefault(); });
sliderEl.addEventListener('pointermove', e => { if (sliderHeld) setSlider(e); });
const sliderUp = () => { sliderHeld = false; };   // the bucket stays where you leave it

const keys = new Set();
addEventListener('keydown', e => { keys.add(e.code); if (e.code.startsWith('Arrow') || e.code === 'Space') e.preventDefault(); });
addEventListener('keyup', e => keys.delete(e.code));
addEventListener('blur', () => keys.clear());
function readKeys(dt) {
  const x = (keys.has('ArrowRight') || keys.has('KeyD') ? 1 : 0) - (keys.has('ArrowLeft') || keys.has('KeyA') ? 1 : 0);
  const z = (keys.has('ArrowDown') || keys.has('KeyS') ? 1 : 0) - (keys.has('ArrowUp') || keys.has('KeyW') ? 1 : 0);
  if (x || z) { input.dir = new THREE.Vector3(x, 0, z).normalize(); input.mag = 1; input.keyDrive = true; }
  else if (input.keyDrive) { input.dir = null; input.mag = 0; input.keyDrive = false; }
  if (keys.has('KeyQ') || keys.has('KeyR')) input.bucket = Math.min(1, input.bucket + dt * 0.8);
  if (keys.has('KeyE') || keys.has('KeyF')) input.bucket = Math.max(0, input.bucket - dt * 0.8);
}

// ---------------------------------------------------------------------------
// Game
// ---------------------------------------------------------------------------
const state = { score: [0, 0], time: CFG.matchTime, playing: false, countdown: 0, autoPlayer: false };
let diggers = [];

function reset() {
  if (world) {
    world.free();
    scene.children.filter(o => !o.isLight).forEach(o => scene.remove(o));
    scene.add(sun);
  }
  coins.length = 0; rainQueue.length = 0;
  world = new RAPIER.World({ x: 0, y: -22, z: 0 });   // stronger than real gravity so coins drop and settle snappily
  world.numSolverIterations = CFG.solver.iterations;
  world.integrationParameters.contact_natural_frequency = CFG.solver.contactFrequency;
  world.timestep = CFG.dt;
  buildArena();
  buildCoins();
  diggers = [
    makeDigger(0, new THREE.Vector3(-4, 0, 9), Math.PI, '#ffc53d'),
    makeDigger(1, new THREE.Vector3(4, 0, -9), 0, '#ff5a4f'),
  ];
  diggers[0].allowReverse = true;
  input.bucket = 0;
  Object.assign(state, { score: [0, 0], time: CFG.matchTime, playing: false, countdown: 3 });
  document.getElementById('panel').hidden = true;
}

function step(dt) {
  rain(dt);
  if (!state.playing && state.countdown > 0) {
    state.countdown -= dt;
    if (state.countdown <= 0) state.playing = true;
  } else if (state.playing) {
    state.time -= dt;
    if (state.time <= 0) { state.time = 0; state.playing = false; endMatch(); }
  }
  const live = state.playing;
  for (const d of diggers) {
    let dir = null, mag = 0;
    if (d.idx === 0 && !state.autoPlayer) { dir = input.dir; mag = input.mag; d.sTarget = input.bucket; }
    else [dir, mag] = aiControl(d, dt);
    if (!live) { dir = null; mag = 0; }
    drive(d, dir, mag, dt);
    const ds = d.sTarget - d.s, maxStep = CFG.digger.bucketSpeed * dt;
    d.s += Math.max(-maxStep, Math.min(maxStep, ds));
    placeBucket(d, false);
  }
  for (const d of diggers) flipAssist(d, diggers[1 - d.idx], dt);
  for (const d of diggers) holdLoad(d, dt);
  world.step();
  for (const c of coins) {                 // no coin gets flung skyward
    if (!c.live || c.body.isSleeping()) continue;
    const v = c.body.linvel();
    if (v.y > CFG.solver.maxCoinUp) c.body.setLinvel({ x: v.x, y: CFG.solver.maxCoinUp, z: v.z }, true);
  }
  collectCoins();
}

function endMatch() {
  const [a, b] = state.score;
  state.result = a > b ? `You win ${a}–${b}` : a < b ? `Rival wins ${b}–${a}` : `Draw ${a}–${b}`;
  document.getElementById('panel').hidden = false;
}
document.getElementById('againBtn').addEventListener('click', reset);

// Render
// ---------------------------------------------------------------------------
const ui = {
  you: document.getElementById('scoreYou'), rival: document.getElementById('scoreRival'),
  timer: document.getElementById('timer'), msg: document.getElementById('msg'), knob, load: document.getElementById('load'),
};
const camTarget = new THREE.Vector3();
function syncScene() {
  coins.forEach((c, i) => {
    if (!c.live) { _m.makeScale(0, 0, 0); coinMesh.setMatrixAt(i, _m); return; }
    const t = c.body.translation(), r = c.body.rotation();
    _m.compose(_v.set(t.x, t.y, t.z), _q.set(r.x, r.y, r.z, r.w), new THREE.Vector3(1, 1, 1));
    coinMesh.setMatrixAt(i, _m);
  });
  coinMesh.instanceMatrix.needsUpdate = true;
  for (const d of diggers) {
    const t = d.body.translation(), r = d.body.rotation();
    d.group.position.set(t.x, t.y, t.z); d.group.quaternion.set(r.x, r.y, r.z, r.w);
    const bt = d.bucketBody.translation(), br = d.bucketBody.rotation();
    d.bucketGroup.position.set(bt.x, bt.y, bt.z); d.bucketGroup.quaternion.set(br.x, br.y, br.z, br.w);
    for (const a of d.arms) { a.rotation.x = -d.armAngle; a.scale.z = CFG.digger.armLength; }
  }
}
function updateCamera() {
  const o = window.__cd?.camOverride;   // debug: fixed close-up
  if (o) { camera.position.set(...o.pos); camera.lookAt(...o.target); return; }
  const p = diggers[0].group.position;
  camTarget.lerp(new THREE.Vector3(p.x * 0.5, 0, p.z * 0.7), 0.08);
  const aspect = window.innerWidth / window.innerHeight;
  const h = aspect < 0.8 ? 40 : 30;                       // further back on a tall phone screen
  camera.position.set(camTarget.x, h, camTarget.z + h * 0.55);
  camera.lookAt(camTarget);
}
function updateHud() {
  ui.you.textContent = state.score[0];
  ui.rival.textContent = state.score[1];
  const s = Math.ceil(state.time);
  ui.timer.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  ui.knob.style.bottom = (diggers[0].s * 100).toFixed(1) + '%';
  const n = diggers[0].load || 0;
  const loadText = n ? `Load ${n}` : 'Bucket';
  if (ui.load.textContent !== loadText) ui.load.textContent = loadText;
  let msg = '';
  if (!state.playing && state.countdown > 0) msg = String(Math.ceil(state.countdown));
  else if (state.playing && state.time > CFG.matchTime - 0.8) msg = 'Dig!';
  else if (!state.playing && state.result && state.time <= 0) msg = state.result;
  else if (state.playing && (diggers[0].tipTime || 0) > 0.4) msg = "You're flipped!";
  else if (state.playing && (diggers[1].tipTime || 0) > 0.4) msg = 'Rival flipped!';
  if (ui.msg.textContent !== msg) ui.msg.textContent = msg;
}
addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

let last = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  readKeys(dt);
  acc += dt;
  let n = 0;
  if (window.__cd?.paused) acc = 0;   // debug: hold the simulation still
  while (acc >= CFG.dt && n < 4) { step(CFG.dt); acc -= CFG.dt; n++; }
  if (n === 4) acc = 0;
  syncScene(); updateCamera(); updateHud();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

// Debug hook for automated testing
window.__cd = {
  state, CFG, get diggers() { return diggers; }, input,
  coinPositions: () => coins.filter(c => c.live).map(c => { const t = c.body.translation(); return new THREE.Vector3(t.x, t.y, t.z); }),
  coinById: () => coins.map(c => { if (!c.live) return null; const t = c.body.translation(); return new THREE.Vector3(t.x, t.y, t.z); }),   // stable indices for tracking
  sim(seconds) {
    const t0 = performance.now();
    for (let i = 0; i < Math.round(seconds / CFG.dt); i++) step(CFG.dt);
    syncScene();
    const live = coins.filter(c => c.live);
    return { score: state.score.slice(), time: +state.time.toFixed(1), live: live.length,
      escaped: live.filter(c => { const p = c.body.translation(); return Math.abs(p.x) > CFG.arena.halfX + 1 || Math.abs(p.z) > CFG.arena.halfZ + 1; }).length,
      ai: diggers.map(d => d.ai.mode), msPerSimSec: +((performance.now() - t0) / seconds).toFixed(0) };
  },
};

(async function boot() {
  await RAPIER.init();
  reset();
  requestAnimationFrame(t => { last = t; frame(t); });
})();
</script>
